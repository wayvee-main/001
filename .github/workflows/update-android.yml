name: Push Android update

# Publishes a JavaScript-only update to an already-installed APK, over the air.
# Under a minute, against roughly 10-20 for a native rebuild.
#
# This is how the app on a phone follows changes as they are made, and there is
# nothing to reinstall. It lands on the SECOND cold start after publishing, not
# the first: app.json sets no fallbackToCacheTimeout, so @expo/config-plugins
# resolves LAUNCH_WAIT_MS to 0 (utils/Updates.js:189) against a CHECK_ON_LAUNCH
# of ALWAYS. The app therefore starts from the bundle it already has and fetches
# the new one in the background, which the next cold start runs. Backgrounding
# and resuming is not a cold start. Setting updates.fallbackToCacheTimeout to a
# few thousand ms trades a slower start for same-launch delivery — but it edits
# app.json, so it costs a rebuild and a reinstall to take effect.
#
# What it CANNOT deliver is native change: a new expo-* package, a config
# plugin, a permission, an icon, anything in app.json. app.json sets
# runtimeVersion to the fingerprint policy precisely so those cases are caught
# rather than shipped — the fingerprint changes, the installed APK no longer
# matches the update's runtime version, and the phone simply keeps what it has
# instead of loading JavaScript that needs native code it does not have. If an
# update never seems to arrive, that is the first thing to check: rebuild.
#
# Required secret: EXPO_TOKEN

on:
  # Every JavaScript change that lands on main publishes itself. The paths are
  # the ones that end up in the bundle; a change to docs, the backend, the sync
  # scripts or the workflows is not something a phone can receive, so it does
  # not spend a run.
  #
  # app.json and eas.json are deliberately absent. Editing either changes the
  # fingerprint, and therefore the runtime version, so an update built from it
  # targets a runtime no installed build has — it would publish successfully
  # and reach nothing. Those changes need "Build Android APK" and a reinstall.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'babel.config.js'
      - 'metro.config.js'
      - 'tailwind.config.js'
      - 'tsconfig.json'
  workflow_dispatch:
    inputs:
      branch:
        description: 'EAS Update branch (match the build profile: preview builds read the preview branch)'
        required: true
        default: 'preview'
        type: string
      message:
        description: 'What changed'
        required: false
        default: ''
        type: string

# A second push while the first is still publishing would race it, and the
# loser would be whichever finished last rather than whichever is newer.
concurrency:
  group: android-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Check configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Not configured yet: secret EXPO_TOKEN"
            exit 1
          fi
          url=$(node -p "require('./app.json').expo.updates?.url || ''")
          if [ -z "$url" ]; then
            echo "::error::app.json has no updates.url, so there is no endpoint to publish to."
            echo "Run 'eas update:configure' once; it writes the URL for this project."
            exit 1
          fi
          echo "Publishing to $url"

      # The same checks a change would face before a deploy. An OTA update
      # reaches phones directly, with no build step in between to catch a type
      # error, so this is the only gate it gets.
      - run: npx tsc --noEmit
      - run: npx jest

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish update
        env:
          # Via env rather than ${{ }} interpolated into the script: a value
          # containing a quote or a backtick would otherwise be parsed as
          # shell rather than passed as text.
          INPUT_MESSAGE: ${{ inputs.message }}
          INPUT_BRANCH: ${{ inputs.branch }}
        run: |
          message="$INPUT_MESSAGE"
          [ -n "$message" ] || message="$(git log -1 --pretty=%s)"
          # Empty on a push event; preview is the channel the installed APK
          # is built against.
          branch="$INPUT_BRANCH"
          [ -n "$branch" ] || branch="preview"
          eas update \
            --branch "$branch" \
            --message "$message" \
            --non-interactive
