name: Trigger Vercel deploy

# Vercel Hobby plan blocks any git-integration deployment (push OR Deploy
# Hook — both resolve to "build this commit") whose commit author isn't a
# project member: "Deployment Blocked ... commit author did not have
# contributing access ... Hobby Plan does not support collaboration for
# private repositories." Upgrading to Pro is the supported fix for that path.
#
# This workflow takes a different path entirely: the Vercel CLI, authenticated
# with a token instead of a GitHub identity. A CLI deploy is not a git-linked
# deployment, so the commit-author check never applies — this runs regardless
# of who authored the triggering commit.
#
# Setup (one-time):
#   1. vercel.com/account/tokens -> create a token -> add as repo secret VERCEL_TOKEN
#   2. From the project locally: `npx vercel link` (creates .vercel/project.json)
#      -> copy "orgId" into repo secret VERCEL_ORG_ID, "projectId" into VERCEL_PROJECT_ID
#   3. Any env vars the web build needs (EXPO_PUBLIC_SUPABASE_URL, etc.) should
#      already be set in Vercel -> Project -> Settings -> Environment Variables
#      (Production) — `vercel pull` below pulls those in automatically.

on:
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --global vercel@latest

      - name: Pull Vercel project settings + production env vars
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Patch sensitive env vars
        # Vercel Production copies of these two are marked "Sensitive", so
        # `vercel pull` only fetches a `[SENSITIVE]` placeholder for them
        # (real value only resolves on Vercel-hosted builds). `vercel build`
        # reads .vercel/.env.production.local itself and that placeholder
        # wins over any step-level env we set — so overwrite the file
        # in place with the real values from GitHub secrets before building.
        run: |
          sed -i '/^EXPO_PUBLIC_SUPABASE_URL=/d;/^EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/d' .vercel/.env.production.local
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ vars.SUPABASE_URL }}" >> .vercel/.env.production.local
          echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" >> .vercel/.env.production.local

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt output
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
