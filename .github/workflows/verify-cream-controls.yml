name: Verify cream surfaces, controls and weather
on:
  push:
    branches: ['codex/qa-cream-controls-2026-10-21']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: UTC
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: Install browser
        run: |
          npm install --prefix /tmp/wayvee-tile-tools --no-package-lock --ignore-scripts playwright
          node /tmp/wayvee-tile-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check both themes and live weather
        env:
          NODE_PATH: /tmp/wayvee-tile-tools/node_modules
        run: node scripts/verify-cream-controls.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cream-controls
          path: cream-controls-preview/
          retention-days: 14
