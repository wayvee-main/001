name: Collect menus and photos

on:
  schedule:
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
    inputs:
      requests:
        description: 'External HTTP ceiling (robots, redirects, PDFs, photos and browser requests all count)'
        required: true
        default: '3000'
        type: choice
        options: ['0', '100', '800', '3000']
  push:
    branches: [main]
    paths:
      - 'scripts/sync-menu-photo-pool.ts'
      - 'scripts/lib/menu-photo-extract.ts'
      - 'scripts/lib/collection-loader.ts'
      - 'scripts/lib/menu-browser.ts'
      - 'scripts/lib/menu-documents.ts'
      - 'scripts/lib/menu-source-reader.ts'
      - 'scripts/lib/menu-photo-policy.ts'
      - 'scripts/lib/photo-validation.ts'
      - 'scripts/test-menu-photo-queue.mjs'
      - 'scripts/test-photo-decoder.ts'
      - 'scripts/lib/__tests__/menu-photo-queue.sql'
      - 'scripts/lib/__tests__/menu-photo-bulk.sql'
      - 'scripts/lib/menu-schema.ts'
      - 'scripts/lib/regional-details.ts'
      - 'src/lib/detail-content.ts'
      - 'supabase/migrations/20261027010000_menu_photo_collection.sql'
      - 'supabase/migrations/20261103010000_menu_photo_throughput.sql'
      - 'supabase/migrations/20261105010000_menu_photo_bulk.sql'
      - '.github/workflows/sync-menu-photo-pool.yml'

permissions:
  contents: read
concurrency:
  group: menu-photo-collector
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check collection code
        run: |
          npx tsc --noEmit
          npx jest scripts/lib/__tests__/menu-photo-extract.test.ts scripts/lib/__tests__/collection-loader.test.ts scripts/lib/__tests__/menu-source-reader.test.ts scripts/lib/__tests__/regional-details.test.ts scripts/lib/__tests__/menu-photo-policy.test.ts scripts/lib/__tests__/photo-validation.test.ts src/lib/__tests__/detail-content.test.ts --runInBand --forceExit
      - name: Prepare isolated collection tools
        run: |
          npm install --prefix "$RUNNER_TEMP/wayvee-collection-tools" --no-package-lock --ignore-scripts @electric-sql/pglite@0.5.12 sharp@0.34.5
      - name: Check queue budgets, inventory and leases in isolated PostgreSQL
        run: |
          node scripts/test-menu-photo-queue.mjs
          npx --yes tsx scripts/test-photo-decoder.ts
        env:
          MENU_PHOTO_SQL_TEST_ROOT: ${{ runner.temp }}/wayvee-collection-tools
          MENU_PHOTO_TOOLS_ROOT: ${{ runner.temp }}/wayvee-collection-tools
      - uses: supabase/setup-cli@v1
        with:
          version: v3.0.0
      - name: Apply menu/photo queue migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REGIONAL_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$REGIONAL_PROJECT_REF"
          for attempt in 1 2 3; do
            if supabase db push --remote --yes; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Prepare document tools
        timeout-minutes: 6
        continue-on-error: true
        run: |
          if ! command -v pdftotext >/dev/null || ! command -v tesseract >/dev/null; then
            timeout 210s sudo apt-get update -qq
            timeout 150s sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng
          fi
      - uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/wayvee-enrichment-browser
            ~/.cache/ms-playwright
          key: menu-photo-browser-${{ runner.os }}-1.64.1
      - name: Prepare optional browser fallback
        timeout-minutes: 3
        continue-on-error: true
        run: |
          if [ ! -f "$RUNNER_TEMP/wayvee-enrichment-browser/node_modules/playwright/package.json" ]; then
            timeout 90s npm install --prefix "$RUNNER_TEMP/wayvee-enrichment-browser" --no-package-lock --ignore-scripts playwright@1.64.1
          fi
          browser_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -n "$browser_path" ]; then
            echo "MENU_PHOTO_BROWSER_EXECUTABLE=$browser_path" >> "$GITHUB_ENV"
          else
            timeout 120s "$RUNNER_TEMP/wayvee-enrichment-browser/node_modules/.bin/playwright" install chromium
          fi
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/wayvee-menu-photo-sources-v3.json
          key: menu-photo-v3-${{ hashFiles('scripts/lib/menu-photo-extract.ts', 'scripts/lib/menu-schema.ts', 'src/lib/detail-content.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            menu-photo-v3-${{ hashFiles('scripts/lib/menu-photo-extract.ts', 'scripts/lib/menu-schema.ts', 'src/lib/detail-content.ts') }}-
      - name: Collect bounded menu/photo batches
        run: npx --yes tsx scripts/sync-menu-photo-pool.ts
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MENU_PHOTO_REQUEST_LIMIT: ${{ inputs.requests || '3000' }}
          MENU_PHOTO_BROWSER_ROOT: ${{ runner.temp }}/wayvee-enrichment-browser
          MENU_PHOTO_CACHE_PATH: ${{ runner.temp }}/wayvee-menu-photo-sources-v3.json
          MENU_PHOTO_TOOLS_ROOT: ${{ runner.temp }}/wayvee-collection-tools
          MENU_PHOTO_SUMMARY_PATH: ${{ runner.temp }}/wayvee-menu-photo-summary.json
      - name: Retain compact coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-photo-coverage
          path: ${{ runner.temp }}/wayvee-menu-photo-summary.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ runner.temp }}/wayvee-menu-photo-sources-v3.json
          key: menu-photo-v3-${{ hashFiles('scripts/lib/menu-photo-extract.ts', 'scripts/lib/menu-schema.ts', 'src/lib/detail-content.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
