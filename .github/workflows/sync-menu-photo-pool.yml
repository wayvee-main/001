name: Collect menus and photos

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      requests:
        description: 'External HTTP ceiling (robots, redirects, PDFs, photos and browser requests all count)'
        required: true
        default: '200'
        type: choice
        options: ['0', '20', '100', '200']
  push:
    branches: [main]
    paths:
      - 'scripts/sync-menu-photo-pool.ts'
      - 'scripts/lib/menu-photo-extract.ts'
      - 'scripts/lib/collection-loader.ts'
      - 'scripts/lib/menu-browser.ts'
      - 'scripts/lib/menu-documents.ts'
      - 'scripts/lib/menu-source-reader.ts'
      - 'scripts/lib/menu-schema.ts'
      - 'scripts/lib/regional-details.ts'
      - 'src/lib/detail-content.ts'
      - 'supabase/migrations/20261027010000_menu_photo_collection.sql'
      - '.github/workflows/sync-menu-photo-pool.yml'

permissions:
  contents: read
concurrency:
  group: menu-photo-collector
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check collection code
        run: |
          npx tsc --noEmit
          npx jest scripts/lib/__tests__/menu-photo-extract.test.ts scripts/lib/__tests__/collection-loader.test.ts scripts/lib/__tests__/menu-source-reader.test.ts scripts/lib/__tests__/regional-details.test.ts src/lib/__tests__/detail-content.test.ts --runInBand --forceExit
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply menu/photo queue migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REGIONAL_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$REGIONAL_PROJECT_REF"
          for attempt in 1 2 3; do
            if supabase db push; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Install isolated document and browser tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng
          npm install --prefix "$RUNNER_TEMP/wayvee-enrichment-browser" --no-package-lock --ignore-scripts playwright@1.64.1
          "$RUNNER_TEMP/wayvee-enrichment-browser/node_modules/.bin/playwright" install --with-deps chromium
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/wayvee-menu-photo-sources-v2.json
          key: menu-photo-v2-${{ hashFiles('scripts/lib/menu-photo-extract.ts', 'scripts/lib/menu-schema.ts', 'src/lib/detail-content.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            menu-photo-v2-${{ hashFiles('scripts/lib/menu-photo-extract.ts', 'scripts/lib/menu-schema.ts', 'src/lib/detail-content.ts') }}-
      - name: Collect bounded menu/photo batches
        run: npx --yes tsx scripts/sync-menu-photo-pool.ts
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MENU_PHOTO_REQUEST_LIMIT: ${{ inputs.requests || '200' }}
          MENU_PHOTO_BROWSER_ROOT: ${{ runner.temp }}/wayvee-enrichment-browser
          MENU_PHOTO_CACHE_PATH: ${{ runner.temp }}/wayvee-menu-photo-sources-v2.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ runner.temp }}/wayvee-menu-photo-sources-v2.json
          key: menu-photo-v2-${{ hashFiles('scripts/lib/menu-photo-extract.ts', 'scripts/lib/menu-schema.ts', 'src/lib/detail-content.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
