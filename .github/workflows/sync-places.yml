name: Sync places

# Pulls bulk restaurant/bar/venue data (Overture Maps + OpenStreetMap) into
# the places table. Runs on GitHub's runners (normal internet access) since
# scripts/sync-places.ts needs to reach Overture's S3 bucket, the Overpass
# API, and Supabase directly — see scripts/sync-places.ts for what it does.

on:
  schedule:
    - cron: '43 10 * * 1' # weekly — this data doesn't change fast enough to justify daily
  workflow_dispatch: {} # manual "Run workflow" button in the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run sync:places
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
