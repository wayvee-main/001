name: Sync menu schema data

# Reads schema.org/Menu structured data from each place's own official
# website. NOT YET BUILT: scripts/sync-menu-schema.ts and the sync:menus
# script it needs do not exist, so running this fails with "Missing script".
# The workflow is kept as the shape the job will take. Manual dispatch only,
# and when it is built it will depend on public.places already being
# populated (run "Sync places" first).

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'One city slug to sync (blank = every launched city)'
        required: false
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run sync:menus
        env:
          WAYVEE_CITY: ${{ inputs.city }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
