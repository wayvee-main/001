name: Populate detail content

on:
  workflow_dispatch:
    inputs:
      city:
        description: 'One launched city (blank = all)'
        required: false
        type: string
  schedule:
    - cron: '13 10 * * 2'
  push:
    branches: [main]
    paths:
      - 'scripts/sync-menu-schema.ts'
      - 'scripts/lib/menu-schema.ts'
      - 'scripts/lib/detail-source-cache.ts'
      - 'scripts/lib/ticketmaster-details.ts'
      - 'scripts/sync-ticketmaster.ts'
      - 'scripts/sync-events.ts'
      - 'src/lib/events.ts'
      - 'src/lib/detail-content.ts'
      - 'src/lib/catalog-identity.ts'
      - 'src/lib/detail-journal.ts'
      - 'src/lib/verified-menu-details.ts'
      - 'supabase/migrations/20261025000000_detail_content.sql'
      - '.github/workflows/sync-menu-schema.yml'

concurrency:
  group: detail-content-sync
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        with:
          path: .cache/detail-sources-v1.json
          key: detail-sources-v1-${{ hashFiles('scripts/lib/menu-schema.ts', 'scripts/lib/detail-source-cache.ts', 'src/lib/detail-content.ts', 'src/lib/catalog-identity.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            detail-sources-v1-${{ hashFiles('scripts/lib/menu-schema.ts', 'scripts/lib/detail-source-cache.ts', 'src/lib/detail-content.ts', 'src/lib/catalog-identity.ts') }}-
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply detail content columns
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DETAIL_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$DETAIL_PROJECT_REF"
          for attempt in 1 2 3; do
            if supabase db push; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
      - name: Publish current curated event content
        run: npm run sync:events
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Retain event artist and venue content
        run: npm run sync:ticketmaster
        env:
          WAYVEE_CITY: ${{ inputs.city }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      - name: Populate official menus and place photos
        run: npx --yes tsx scripts/sync-menu-schema.ts
        env:
          WAYVEE_CITY: ${{ inputs.city }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/detail-sources-v1.json
          key: detail-sources-v1-${{ hashFiles('scripts/lib/menu-schema.ts', 'scripts/lib/detail-source-cache.ts', 'src/lib/detail-content.ts', 'src/lib/catalog-identity.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
