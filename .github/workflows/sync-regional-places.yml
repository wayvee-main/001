name: Collect Bay Area places

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      source_requests:
        description: 'Maximum OSM HTTP requests, including retries (0 = skip identity downloads)'
        required: false
        default: '6'
        type: choice
        options: ['0', '3', '6', '12']
      detail_requests:
        description: 'Maximum official-site HTTP requests, including redirects and menu pages'
        required: false
        default: '30'
        type: choice
        options: ['0', '10', '30']
  push:
    branches: [main]
    paths:
      - 'scripts/sync-regional-places.ts'
      - 'scripts/lib/regional-places.ts'
      - 'scripts/sync-regional-details.ts'
      - 'scripts/lib/regional-details.ts'
      - 'scripts/lib/official-source-loader.ts'
      - 'scripts/lib/detail-source-cache.ts'
      - 'scripts/lib/menu-schema.ts'
      - 'src/lib/detail-content.ts'
      - 'supabase/migrations/20261025010000_regional_places.sql'
      - 'supabase/migrations/20261025020000_regional_details_queue.sql'
      - '.github/workflows/sync-regional-places.yml'

permissions:
  contents: read

concurrency:
  group: regional-places-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache/restore@v4
        with:
          path: .cache/regional-detail-sources-v1.json
          key: regional-details-v1-${{ hashFiles('scripts/lib/menu-schema.ts', 'scripts/lib/detail-source-cache.ts', 'scripts/lib/official-source-loader.ts', 'scripts/lib/regional-details.ts', 'src/lib/detail-content.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            regional-details-v1-${{ hashFiles('scripts/lib/menu-schema.ts', 'scripts/lib/detail-source-cache.ts', 'scripts/lib/official-source-loader.ts', 'scripts/lib/regional-details.ts', 'src/lib/detail-content.ts') }}-
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply additive regional pool migration
        id: migrate
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          REGIONAL_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$REGIONAL_PROJECT_REF"
          supabase db push
      - name: Collect bounded regional batches
        run: npx --yes tsx scripts/sync-regional-places.ts
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REGIONAL_SOURCE_REQUEST_LIMIT: ${{ inputs.source_requests || '6' }}
          REGIONAL_BATCH_LIMIT: '6'
      - name: Enrich regional official menus and photos
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        run: npx --yes tsx scripts/sync-regional-details.ts
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REGIONAL_DETAIL_REQUEST_LIMIT: ${{ inputs.detail_requests || '30' }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/regional-detail-sources-v1.json
          key: regional-details-v1-${{ hashFiles('scripts/lib/menu-schema.ts', 'scripts/lib/detail-source-cache.ts', 'scripts/lib/official-source-loader.ts', 'scripts/lib/regional-details.ts', 'src/lib/detail-content.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
