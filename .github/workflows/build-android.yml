name: Build Android APK

# Builds an installable APK on EAS and prints the download link.
#
# The `preview` profile in eas.json is the one that produces an .apk with
# internal distribution — `production` produces an .aab for the Play Store,
# which a phone cannot install directly.
#
# This is the slow path: a native build takes roughly 10-20 minutes. Run it
# when native code changes — a new expo-* package, a plugin, an icon, or
# anything in app.json. For JavaScript changes, use "Push Android update"
# instead: it reaches an already-installed APK in under a minute.
#
# Required secret:
#   EXPO_TOKEN   expo.dev -> Account Settings -> Access Tokens
#
# app.json's `owner` and `extra.eas.projectId` must both point at an Expo
# account you can build under. `eas init` writes them.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'eas.json build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview        # .apk, installable directly
          - development    # .apk with the dev client, for debugging
          - production     # .aab, Play Store only — not phone-installable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Check configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Not configured yet: secret EXPO_TOKEN"
            echo "expo.dev -> Account Settings -> Access Tokens"
            exit 1
          fi
          owner=$(node -p "require('./app.json').expo.owner || ''")
          project=$(node -p "require('./app.json').expo.extra?.eas?.projectId || ''")
          echo "Building as owner=${owner:-<logged-in account>} projectId=${project:-<none>}"
          # A projectId that names a project the token cannot see fails deep in
          # the build with a GraphQL error, which reads like an outage rather
          # than a config problem. Checking here keeps the cause legible.
          if [ -z "$project" ]; then
            echo "::error::app.json has no extra.eas.projectId, so there is no EAS project to build."
            echo "Run 'eas init' locally, then commit the app.json it writes."
            exit 1
          fi
          if [ "$owner" = "citycues-team" ] || [ "$project" = "a2de9c0f-2166-4f64-b5ac-b1e69664d2ef" ]; then
            echo "::error::app.json still points at the previous Expo project."
            echo "Delete 'owner' and 'extra.eas.projectId', run 'eas init', and commit the result."
            exit 1
          fi

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --wait so the run reflects the real outcome rather than "submitted".
      # --non-interactive because there is no one here to answer a prompt.
      - name: Build
        run: |
          eas build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --wait

      - name: Link to the build
        if: always()
        run: |
          echo "## Android build" >> "$GITHUB_STEP_SUMMARY"
          eas build:list --platform android --limit 1 --non-interactive 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
