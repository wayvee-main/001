 const facts=item=>`<span class="wv-facts">${item.facts.map(([glyph,text])=>`<span>${icon(glyph)}${esc(text)}</span>`).join('')}</span>`;
 function row(id){const x=catalog[id];return `<button class="wv-result cursor-interaction" data-open="${id}" data-tooltip="${esc(x.name)}">${picture(x.photo,'wv-thumb',x.glyph,x.name)}<span class="wv-copy"><h3>${esc(x.name)}</h3><span class="wv-sub">${esc(x.type)}</span>${facts(x)}</span><span class="wv-chev">${icon('chevron-right')}</span></button>`;}
 function mini(id){const x=catalog[id];return `<button class="wv-mini cursor-interaction" data-open="${id}" data-tooltip="${esc(x.name)}">${picture(x.photo,'wv-thumb',x.glyph,x.name)}<h3>${esc(x.name)}</h3><span class="wv-sub">${esc(x.type)}</span>${facts(x)}</button>`;}
 function ideasMarkup(){return ideas[settings.period].map(x=>`<button class="wv-idea cursor-interaction" data-idea="${x.id}">${picture(null,'wv-thumb',x.glyph)}<span class="wv-copy"><h3>${esc(x.name)}</h3><span class="wv-sub">${esc(x.about)}</span></span><span class="wv-chev">${icon('chevron-right')}</span></button>`).join('');}
 function collectionsMarkup(){return collectionSets[settings.period].map(([id,title,sub,glyph,items])=>`<button class="wv-collection cursor-interaction" data-collection="${id}"><b>${timeNames[settings.period]}</b><div><span class="wv-copy"><h3>${esc(title)}</h3><span class="wv-sub">${esc(sub)}</span></span>${icon(glyph)}${icon('chevron-right')}</div><span class="wv-facts"><span>${icon('list')}${items.length} places</span><span>${icon('bookmark')}A shortlist</span></span></button>`).join('');}
 function pills(s){const choices=s.category==='eat'?['All','A good table','Quick bites']:s.category==='bars'?['All','Cocktails','Listening rooms']:s.category==='routes'?['All','Walking','Rides']:['All','This week','Live music'];return `<div class="wv-pills">${choices.map(x=>`<button class="wv-pill cursor-interaction" data-filter="${esc(x)}" aria-pressed="${s.filter===x}">${x==='All'?icon('sliders-horizontal'):''}${esc(x)}</button>`).join('')}</div>`;}
 function selectedIds(s){let list=[...ids[s.category]];if(s.category==='eat'&&s.filter==='Quick bites')list=['cook'];if(s.category==='bars'&&s.filter==='Listening rooms')list=['shiru'];if(s.category==='routes'&&s.filter==='Walking')list=['downtown','uptown'];if(s.category==='routes'&&s.filter==='Rides')list=['institutions'];return list;}
 function category(el,s){const design=el.dataset.design,cat=s.category,list=selectedIds(s),title=categoryNames[cat];let top=`<div class="wv-eyebrow">${icon(categoryIcons[cat])}Oakland · ${timeNames[settings.period]}</div>`;
  if(design==='ledger')top+=`<div class="wv-ledger-head"><h1>${title}</h1><span class="wv-ledger-count">${list.length.toString().padStart(2,'0')}</span></div>`;
  else top+=`<h1>${title}</h1><p class="wv-sub wv-intro">${subtitles[cat]}</p>`;
  if(design==='photo'){const photo=cat==='eat'?'eat':cat==='bars'?'bars':cat==='routes'?'routes':'events';top+=`<div class="wv-hero"><img src="${photos[photo]}" alt="${title} in Oakland"><div class="wv-hero-copy"><span class="wv-overline">The local edit</span><h2>${cat==='eat'?'Find a good table':cat==='bars'?'Stay for one more':cat==='routes'?'Take the long way':'A little more live'}</h2></div></div>`;}
  top+=pills(s);
  if(design==='guide'){const x=catalog[list[0]];return top+`<div class="wv-feature"><span class="wv-overline">A place to begin</span><div>${picture(x.photo,'wv-thumb',x.glyph,x.name)}<span class="wv-copy"><h3>${esc(x.name)}</h3><span class="wv-sub">${esc(x.type)}</span></span></div><button class="wv-secondary cursor-interaction" data-open="${list[0]}">Take a closer look ${icon('arrow-up-right')}</button></div>${list.length>1?`<div class="wv-section-head"><h2>More good options</h2><span class="wv-sub">${list.length-1} more</span></div>`:''} `+list.slice(1).map(row).join('');}
  if(design==='photo')return top+`<div class="wv-two">${list.slice(0,2).map(mini).join('')}</div><div class="wv-section-head"><h2>Keep looking</h2></div>`+list.slice(2).map(row).join('');
  if(design==='ledger')return top+`<span class="wv-overline">Name · the essentials</span><div style="margin-top:7px">${list.map(row).join('')}</div>`;
  if(design==='daybook')return top+`<div class="wv-timeline">${list.map((id,i)=>`<div class="wv-stop"><div class="wv-overline">${['Start here','Keep it going','Leave a little room'][i]||'Another good stop'}</div>${row(id)}</div>`).join('')}</div><button class="wv-secondary cursor-interaction" data-view="vee">Make an evening of it ${icon('arrow-right')}</button>`;
  const areas=[...new Set(list.map(id=>catalog[id].area))];return top+areas.map(area=>`<section class="wv-chapter"><div class="wv-chapter-head"><h2>${esc(area)}</h2><span>${list.filter(id=>catalog[id].area===area).length} ${list.filter(id=>catalog[id].area===area).length===1?'stop':'stops'}</span></div>${list.filter(id=>catalog[id].area===area).map(row).join('')}</section>`).join('');
 }
 function home(s){return `<h1 style="font-size:25px">Shall we wander?</h1><button class="wv-searchbar cursor-interaction" data-view="search">${icon('search')}<span>Search the city of Oakland</span>${icon('arrow-right')}</button><div class="wv-quick"><button class="cursor-interaction" data-view="stay">${icon('briefcase-business')}${s.hotel?esc(s.hotel):'Link your stay'}</button><span></span><button class="cursor-interaction" data-open="${settings.period==='morning'?'highwire':'cook'}">${icon(settings.period==='morning'?'coffee':'utensils')}${settings.period==='morning'?'Highwire Coffee':'The Cook and Her Farmer'}</button></div><button class="wv-ribbon cursor-interaction" data-view="vee">${mark()}<span class="wv-copy"><h3>Your evening, with Vee</h3><span class="wv-sub">A little more city.</span></span><span class="wv-chev">${icon('arrow-right')}</span></button><hr class="wv-rule"><h2>Around you</h2><div class="wv-home-grid">${['eat','bars','routes','events'].map((key,i)=>`<button class="wv-home-tile cursor-interaction" data-category="${key}"><img src="${photos[key]}" alt="${categoryNames[key]} in Oakland"><span>${categoryNames[key]}<small>${['24','10','3','20'][i]}</small>${icon('chevron-right')}</span></button>`).join('')}</div><div class="wv-section-head"><h2>For you</h2><button class="cursor-interaction" data-view="ideas">See all ${icon('arrow-right')}</button></div>${ideasMarkup()}<div class="wv-section-head"><h2>Collections</h2><button class="cursor-interaction" data-view="collections">See all ${icon('arrow-right')}</button></div>${collectionsMarkup()}`;}
 function editorialList(el,s,title,subtitle,markup){const design=el.dataset.design;let heading=`<div class="wv-eyebrow">${icon('sparkles')}${timeNames[settings.period]}</div><h1>${title}</h1><p class="wv-sub wv-intro">${subtitle}</p>`;
  if(design==='ledger')heading=`<div class="wv-eyebrow">${timeNames[settings.period]}</div><div class="wv-ledger-head"><h1>${title}</h1><span class="wv-ledger-count">${title==='For you'?'03':'02'}</span></div>`;
  if(design==='photo')heading+=`<div class="wv-hero" style="height:146px"><img src="${photos[settings.period==='morning'?'routes':settings.period==='lateNight'?'bars':'eat']}" alt="A little of Oakland"><div class="wv-hero-copy"><span class="wv-overline">${timeNames[settings.period]}</span><h2>${title==='For you'?'Follow a good idea':'Keep the good bits'}</h2></div></div>`;
  if(design==='daybook')return heading+`<div class="wv-timeline"><div class="wv-stop"><div class="wv-overline">${timeNames[settings.period]}</div>${markup}</div></div>`;
  if(design==='chapters')return heading+`<div class="wv-chapter"><div class="wv-chapter-head"><h2>${settings.period==='morning'?'An easy beginning':settings.period==='afternoon'?'Before the evening':settings.period==='evening'?'Out in the city':'One more little thing'}</h2><span>Oakland</span></div>${markup}</div>`;
  return heading+`<div style="margin-top:22px">${markup}</div>`;
 }
 function detail(s){const x=catalog[s.detail];if(!x)return '';return `<div class="wv-detail-hero">${picture(x.photo,'wv-thumb',x.glyph,x.name)}</div><div class="wv-eyebrow">${esc(x.area)}</div><h1>${esc(x.name)}</h1><p class="wv-sub wv-intro">${esc(x.about)}</p>${facts(x)}<button class="wv-primary cursor-interaction" data-save="${s.detail}">${icon(s.saved.has(s.detail)?'bookmark-check':'bookmark')}${s.saved.has(s.detail)?'Saved for later':'Save for later'}</button><div class="wv-detail-note"><span class="wv-overline">Worth knowing</span><p>${esc(x.note)}</p></div><button class="wv-secondary cursor-interaction" data-view="vee">${mark()}Plan around this ${icon('arrow-right')}</button>`;}
 function collectionDetail(s){const c=collectionSets[settings.period].find(x=>x[0]===s.collection)||collectionSets[settings.period][0];return `<div class="wv-eyebrow">${icon(c[3])}${timeNames[settings.period]}</div><h1>${esc(c[1])}</h1><p class="wv-sub wv-intro">${esc(c[2])}</p><div class="wv-facts"><span>${icon('list')}${c[4].length} places</span><span>${icon('bookmark')}A shortlist</span></div><div style="margin-top:23px">${c[4].map(row).join('')}</div>`;}
 function ideaDetail(s){const id=s.idea;let title='',list=[];if(id==='fresh'){title='A little fresh air';list=['lake','redwood','temescal'];}else if(id==='breakfast'||id==='coffee'||id==='tomorrow'){title=id==='tomorrow'?'A start for tomorrow':id==='coffee'?'A good coffee':'Breakfast, then out';list=['highwire','brendas','grandlake'];}else if(id==='shows'){title='Catch something live';list=ids.events;}else if(id==='nightcap'){title='One more good stop';list=ids.bars;}else if(id==='late'){title='A late bite';list=['sinaloa','colonial'];}else{title='Find a good dinner';list=['mua','parche','cook'];}return `<div class="wv-eyebrow">${icon(id==='fresh'?'trees':'sparkles')}${timeNames[settings.period]}</div><h1>${title}</h1><p class="wv-sub wv-intro">A few ways to follow the idea.</p><div style="margin-top:23px">${list.map(row).join('')}</div>`;}
 function search(s){const query=s.query.trim().toLowerCase();const list=Object.keys(catalog).filter(id=>!query||[catalog[id].name,catalog[id].type,catalog[id].area].join(' ').toLowerCase().includes(query)).slice(0,7);return `<div class="wv-eyebrow">${icon('search')}Around Oakland</div><h1>What’s calling?</h1><label class="wv-searchbar">${icon('search')}<input aria-label="Search the city" value="${esc(s.query)}" placeholder="A place, artist, or good idea"></label><div data-search-results>${list.map(row).join('')||'<p class="wv-empty">Try a different name or kind of outing.</p>'}</div>`;}
 function vee(s){return `<div class="wv-eyebrow">${mark()}Vee</div><h1>Where to?</h1><p class="wv-sub wv-intro">Tell Vee the night you want. Vee finds it.</p><form class="wv-form" data-form="vee"><textarea aria-label="Describe your ideal night" placeholder="Describe your ideal night"></textarea><button type="button" class="wv-secondary cursor-interaction" data-action="details">${icon('sliders-horizontal')}Details</button>${s.details?'<label style="margin-top:15px">A little guidance<input name="preferences" placeholder="Budget, pace, or anything to avoid"></label>':''}<button class="wv-primary cursor-interaction" type="submit">Sketch an evening ${icon('arrow-right')}</button></form>${s.plan?`<div class="wv-section-head"><h2>Your evening</h2></div><div class="wv-timeline">${['mua','shiru','bird'].map(id=>`<div class="wv-stop">${row(id)}</div>`).join('')}</div>`:''}`;}
 function stay(s){return `<div class="wv-eyebrow">${icon('briefcase-business')}A little context</div><h1>Link your stay</h1><p class="wv-sub wv-intro">Give the city a starting point.</p><form class="wv-form" data-form="stay"><label>Hotel or neighborhood<input name="hotel" required placeholder="Where are you staying?" value="${esc(s.hotel)}"></label><button class="wv-primary cursor-interaction" type="submit">Keep this starting point ${icon('arrow-right')}</button></form>`;}
 function profile(s){return `<div class="wv-eyebrow">${icon('user-round')}Your corner</div><h1>A little more you.</h1><div class="wv-section-head"><h2>Saved for later</h2><span class="wv-sub">${s.saved.size}</span></div>${s.saved.size?[...s.saved].map(row).join(''):'<p class="wv-sub">Save a place or a route, then find it here.</p>'}<button class="wv-secondary cursor-interaction" data-view="stay">${icon('briefcase-business')}${s.hotel?esc(s.hotel):'Link your stay'}</button><button class="wv-secondary cursor-interaction" data-action="appearance">${icon('sun-moon')}Switch appearance</button>`;}
 function body(el,s){if(s.view==='home')return home(s);if(s.view==='category')return category(el,s);if(s.view==='ideas')return editorialList(el,s,'For you','Good ideas for this part of the day.',ideasMarkup());if(s.view==='collections')return editorialList(el,s,'Collections','Shortlists for this part of the day.',collectionsMarkup());if(s.view==='detail')return detail(s);if(s.view==='collection')return collectionDetail(s);if(s.view==='idea')return ideaDetail(s);if(s.view==='search')return search(s);if(s.view==='vee')return vee(s);if(s.view==='stay')return stay(s);if(s.view==='profile')return profile(s);return `<div class="wv-eyebrow">${icon('bell')}Little reminders</div><h1>All caught up.</h1><p class="wv-sub wv-intro">Your plans and timely reminders will find their way here.</p><button class="wv-secondary cursor-interaction" data-view="home">Back to wandering ${icon('arrow-right')}</button>`;}
 function render(el){const s=state.get(el);el.dataset.theme=settings.appearance;const active=s.view==='home'?'home':s.view==='vee'?'vee':s.view==='profile'?'profile':'discover';el.innerHTML=`<div class="wv-status"><span>${clocks[settings.period]}</span><span>${icon('signal')}${icon('wifi')}${icon('battery-full')}</span></div><div class="wv-topbar">${s.view==='home'?'<span class="wv-word">Wayvee</span>':`<button class="cursor-interaction" data-back>${icon('arrow-left')}${s.history.length>0?'Back':'Home'}</button><span class="wv-serif" style="font-size:17px">Wayvee</span>`}<div>${s.view==='home'?`<button class="wv-round cursor-interaction" data-view="notifications" aria-label="Notifications">${icon('bell')}</button>`:''}<button class="wv-round cursor-interaction" data-view="${s.view==='home'?'profile':'search'}" aria-label="${s.view==='home'?'Profile':'Search'}">${icon(s.view==='home'?'user-round':'search')}</button></div></div><main class="wv-main">${body(el,s)}${s.toast?`<span class="wv-toast" role="status">${esc(s.toast)}</span>`:''}</main><nav class="wv-footnav" aria-label="Wayvee navigation"><div>${[['home','house','Home'],['discover','compass','Discover'],['vee','vee','Vee'],['profile','user-round','You']].map(([key,glyph,label])=>`<button class="cursor-interaction" data-nav="${key}" ${active===key?'aria-current="page"':''}>${glyph==='vee'?mark():icon(glyph)}<span>${label}</span></button>`).join('')}</div></nav>`;if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});}
 function go(el,next,changes={}){const s=state.get(el);s.history.push({view:s.view,category:s.category,detail:s.detail,collection:s.collection,idea:s.idea});Object.assign(s,changes,{view:next,toast:''});render(el);}
 root.addEventListener('click',event=>{const button=event.target.closest('button');const el=button?.closest('.wv-phone');if(!button||!el)return;const s=state.get(el),d=button.dataset;
  if('back'in d){const last=s.history.pop();if(last)Object.assign(s,last);else s.view='home';s.toast='';render(el);return;}
  if(d.category){go(el,'category',{category:d.category,filter:'All'});return;}
  if(d.open){go(el,'detail',{detail:d.open});return;}
  if(d.idea){go(el,'idea',{idea:d.idea});return;}
  if(d.collection){go(el,'collection',{collection:d.collection});return;}
  if(d.filter){s.filter=d.filter;render(el);return;}
  if(d.view){go(el,d.view);return;}
  if(d.nav){s.history=[];s.view=d.nav==='discover'?'category':d.nav;s.category='eat';s.toast='';render(el);return;}
  if(d.save){s.saved.has(d.save)?s.saved.delete(d.save):s.saved.add(d.save);s.toast=s.saved.has(d.save)?'Saved for later. Find it in You.':'Removed from saved places.';render(el);return;}
  if(d.action==='details'){s.details=!s.details;render(el);return;}
  if(d.action==='appearance'){settings.appearance=settings.appearance==='dark'?'light':'dark';document.getElementById('wv-appearance').value=settings.appearance;for(const phone of state.keys())render(phone);}
 });
 root.addEventListener('submit',event=>{const form=event.target.closest('[data-form]');if(!form)return;event.preventDefault();const el=form.closest('.wv-phone'),s=state.get(el);if(form.dataset.form==='stay'){s.hotel=new FormData(form).get('hotel').trim();s.view='home';s.history=[];s.toast='Your starting point is set.';}else{s.plan=true;s.toast='A little shape for your evening.';}render(el);});
 root.addEventListener('input',event=>{if(!event.target.matches('[aria-label="Search the city"]'))return;const el=event.target.closest('.wv-phone'),s=state.get(el);s.query=event.target.value;const q=s.query.trim().toLowerCase();const list=Object.keys(catalog).filter(id=>!q||[catalog[id].name,catalog[id].type,catalog[id].area].join(' ').toLowerCase().includes(q)).slice(0,7);el.querySelector('[data-search-results]').innerHTML=list.map(row).join('')||'<p class="wv-empty">Try a different name or kind of outing.</p>';if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});});
 document.getElementById('wv-appearance').addEventListener('change',event=>{settings.appearance=event.target.value;for(const el of state.keys())render(el);});
 document.getElementById('wv-daypart').addEventListener('change',event=>{settings.period=event.target.value;for(const el of state.keys())render(el);});
 for(const el of state.keys())render(el);
})();
</script>
